[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/piazza_sdk/_version.py"

[project]
name = "piazza-sdk"
dynamic = ["version"]
description = "Modern async Python SDK for Piazza's internal API (2026+)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Ayush Morbar", email = "ayushmorbar@users.noreply.github.com"}
]
keywords = ["piazza", "api", "async", "sdk", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Education",
]
dependencies = [
    "cryptography>=43.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "tenacity>=8.3.0",
]

# Higher-fidelity HTML→Markdown conversion (SDK falls back to stdlib without it)
[project.optional-dependencies]
normalization = [
    "html2text>=2025.4.15",
]

# PEP 735 dependency groups — development-only deps managed by uv.
# These are NOT published as package extras; use `uv sync --group <name>`.
[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pip-audit>=2.7.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocstrings[python]>=0.26.0",
    "mkdocs-material>=9.5.0",
]

[tool.uv]
default-groups = ["dev"]

[project.urls]
Homepage = "https://github.com/ayushmorbar/piazza-sdk"
Documentation = "https://ayushmorbar.github.io/piazza-sdk/"
Repository = "https://github.com/ayushmorbar/piazza-sdk"
Issues = "https://github.com/ayushmorbar/piazza-sdk/issues"
Changelog = "https://github.com/ayushmorbar/piazza-sdk/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.sdist]
include = [
    "src/piazza_sdk/",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/piazza_sdk"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "W", "C90", "ANN", "ARG", "BLE", "COM", "DTZ",
    "EXE", "FA", "ISC", "ICN", "LOG", "N", "PD", "PIE", "PL", "PTH",
    "PT", "Q", "RSE", "RET", "S", "SIM", "T20", "TCH", "TID", "TRY",
]
ignore = [
    "ANN001", "ANN002", "ANN003",
    "ANN401",
    "ARG001", "ARG002",
    "COM812",
    "ISC001",
    "PLR2004",
    "TRY003", "TRY300", "TRY301",
    "PTH111",
]
per-file-ignores."tests/*" = ["S101", "S105", "S106", "SLF001", "ANN201", "DTZ005"]
per-file-ignores."example.py" = ["S106", "T201", "ANN201"]
per-file-ignores."docs/_tutorials/*" = ["S106"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_redundant_casts = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "live: tests that hit the real Piazza API (deselected by default; run with -m live)",
]
addopts = ["--strict-markers", "--tb=short", "-m", "not live"]

[tool.coverage.run]
source = ["src/piazza_sdk"]
branch = true

[tool.coverage.report]
# Ratchet policy: raise by ~5% per release toward an 85% target.
fail_under = 68
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:"
]
