[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "piazza-sdk"
version = "2026.06.22"
description = "Modern async Python SDK for Piazza's internal API (2026+)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Ayush Morbar", email = "ayushmorbar@users.noreply.github.com"}
]
keywords = ["piazza", "api", "async", "sdk", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Education",
]
dependencies = [
    "cryptography>=43.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocstrings[python]>=0.26.0",
    "mkdocs-material>=9.5.0",
]

[project.urls]
Homepage = "https://github.com/ayushmorbar/piazza-sdk"
Documentation = "https://ayushmorbar.github.io/piazza_sdk/"
Repository = "https://github.com/ayushmorbar/piazza-sdk"
Issues = "https://github.com/ayushmorbar/piazza-sdk/issues"
Changelog = "https://github.com/ayushmorbar/piazza-sdk/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/piazza_sdk"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "W", "C90", "ANN", "ARG", "BLE", "COM", "DTZ",
    "EXE", "FA", "ISC", "ICN", "LOG", "N", "PD", "PIE", "PL", "PTH",
    "PT", "Q", "RSE", "RET", "SIM", "T20", "TCH", "TID", "TRY",
]
ignore = [
    "ANN001", "ANN002", "ANN003",
    "ANN401",
    "ARG001", "ARG002",
    "COM812",
    "ISC001",
    "PLR2004",
    "TRY003", "TRY300", "TRY301",
    "PTH111",
]
per-file-ignores."tests/*" = ["S101", "SLF001", "ANN201", "DTZ005"]
per-file-ignores."example.py" = ["T201", "ANN201"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["--strict-markers", "--tb=short"]

[tool.coverage.run]
source = ["src/piazza_sdk"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:"
]